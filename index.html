<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Инструкции по обработкам 1С">
  <title>Инструкции</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f17;
      --card: #151d2b;
      --border: #2a3549;
      --text: #e8edf7;
      --muted: #a5b0c4;
      --accent: #65d6ad;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 0%, rgba(101, 214, 173, 0.1), transparent 32rem),
        var(--bg);
      color: var(--text);
      font: 16px/1.6 Inter, "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.4rem, 7vw, 4.8rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .lead {
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 1.15rem;
    }

    .card {
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(145deg, #182132, var(--card));
      color: inherit;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card h2 {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 1.35rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Инструкции</h1>
    <p class="lead">Справочные материалы по обработкам 1С.</p>

    <a class="card" href="prejskurant.html">
      <h2>Прейскурант</h2>
      <p>Расчёт учётной цены поставки и загрузка спецификации из Excel.</p>
    </a>
  </main>
</body>
</html>
